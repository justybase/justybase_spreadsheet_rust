name: Publish to crates.io

# First publish MUST use a `CARGO_REGISTRY_TOKEN` secret (crates.io allows
# Trusted Publishing only for crates that already exist). After the crate
# exists, register this workflow at
# https://crates.io/crates/justybase-spreadsheet/settings -> Trusted Publishing
# (repository owner/name + workflow file `publish.yml`, environment `crates-io`)
# and delete the secret — publishes then run over OIDC with no stored token.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify only (cargo publish --dry-run, no upload)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC for crates.io Trusted Publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Part of the Trusted Publishing trust config; lets you add required
    # reviewers / wait timers in repo Settings -> Environments.
    environment: crates-io
    env:
      # 'true' when the bootstrap token secret exists. Only the boolean is
      # visible job-wide; the secret value itself is scoped to the Publish
      # step below.
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Resolve crate name and version
        id: meta
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          meta = json.loads(subprocess.check_output(
              ['cargo', 'metadata', '--no-deps', '--format-version=1'],
              text=True))
          root = meta['workspace_root']
          pkgs = [p for p in meta['packages']
                  if os.path.dirname(p['manifest_path']) == root]
          pkg = pkgs[0]
          print(f"name={pkg['name']}")
          print(f"version={pkg['version']}")
          EOF

      - name: Real publish requires a version tag
        if: ${{ !inputs.dry_run }}
        run: |
          test "${{ github.ref_type }}" = "tag" || {
            echo "::error::real publish (dry_run=false) is only allowed from a version tag"
            exit 1
          }

      - name: Tag must match Cargo.toml version
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME#v}" = "${{ steps.meta.outputs.version }}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${{ steps.meta.outputs.version }}"
            exit 1
          }

      - name: Gate (fmt, test, clippy)
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Authenticate (Trusted Publishing)
        id: auth
        if: ${{ !inputs.dry_run && env.HAS_REGISTRY_TOKEN != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish (skip if already on crates.io)
        env:
          # Bootstrap token for the very first publish (crates.io allows
          # Trusted Publishing only for crates that already exist).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "${OIDC_TOKEN:-}" ]; then
            export CARGO_REGISTRY_TOKEN="$OIDC_TOKEN"
          fi
          FLAGS="${{ inputs.dry_run && '--dry-run' || '' }}"
          if [ -z "$FLAGS" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "justybase-spreadsheet-release (github-actions)" \
              "https://crates.io/api/v1/crates/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}")
            if [ "$code" = "200" ]; then
              echo "::notice::${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} already on crates.io — skipping"
              exit 0
            fi
          fi
          # shellcheck disable=SC2086
          cargo publish $FLAGS
