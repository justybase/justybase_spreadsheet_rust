[package]
# NOTE: `spreadsheet` is squatted on crates.io (reserved namespace since 2016),
# so this crate publishes as `justybase-spreadsheet`. The library target keeps
# the short name, so `use spreadsheet::...` keeps working.
name = "justybase-spreadsheet"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Krzysztof Duśko <krzysztof@justybase.com>"]
repository = "https://github.com/justybase/justybase_spreadsheet_rust"
readme = "README.md"
keywords = ["excel", "xlsx", "xlsb", "spreadsheet"]
categories = ["parser-implementations", "data-structures"]
description = "High-performance Excel XLSB/XLSX reader and writer — Rust port of @justybase/spreadsheet-tasks (TypeScript)"
exclude = [
    "BENCHMARKS.md",
    "benches/**",
    "examples/parity_bench.rs",
    "examples/write_comparison.rs",
    "examples/xlsb_write_comparison.rs",
    "parity/bench_ts.ts",
    "parity/dotnet/Bench/**",
]

[lib]
name = "spreadsheet"
path = "src/lib.rs"

[dependencies]
atoi_simd = "0.18"
zip = "8"
chrono = "0.4"
fast-float2 = "0.2"
quick-xml = "0.42"
tempfile = "3"
thiserror = "2"
memchr = "2"
ryu = "1"
itoa = "1"

[dev-dependencies]
# xlsb-writer 0.1.0 exposes Arrow 53 RecordBatch values; keeping the same
# Arrow major here avoids duplicate/incompatible RecordBatch types in the
# comparison example. This also constrains its chrono dependency to <0.4.40.
arrow-array = "53"
arrow-schema = "53"
# Exact pin keeps the calamine cross-check/fingerprint benchmark reproducible.
calamine = "=0.36.1"
criterion = "0.8"
rust_xlsxwriter = { version = "0.99", features = ["chrono", "constant_memory"] }
rxlsb = "0.3"
tempfile = "3"
xlsb-writer = "0.1"

[[bench]]
name = "read_comparison"
harness = false
