[package]
# NOTE: `spreadsheet` is squatted on crates.io (reserved namespace since 2016),
# so this crate publishes as `justybase-spreadsheet`. The library target keeps
# the short name, so `use spreadsheet::...` keeps working.
name = "justybase-spreadsheet"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Krzysztof Duśko <krzysztof@justybase.com>"]
repository = "https://github.com/justybase/justybase_spreadsheet_rust"
readme = "README.md"
keywords = ["excel", "xlsx", "xlsb", "spreadsheet"]
categories = ["parser-implementations", "data-structures"]
description = "High-performance Excel XLSB/XLSX reader and writer — Rust port of @justybase/spreadsheet-tasks (TypeScript)"
exclude = [
    "BENCHMARKS.md",
    "benches/**",
    "examples/parity_bench.rs",
    "examples/write_comparison.rs",
    "examples/xlsb_write_comparison.rs",
    "parity/bench_ts.ts",
    "parity/dotnet/Bench/**",
]

[lib]
name = "spreadsheet"
path = "src/lib.rs"

[dependencies]
atoi_simd = "0.18"
zip = "2"
chrono = "0.4"
fast-float2 = "0.2"
quick-xml = "0.41"
tempfile = "3"
thiserror = "2"
memchr = "2"
ryu = "1"
itoa = "1"

[dev-dependencies]
arrow-array = "53"
arrow-schema = "53"
calamine = "=0.36.1"
criterion = { version = "0.7", features = ["html_reports"] }
rust_xlsxwriter = { version = "0.99", features = ["chrono", "constant_memory"] }
rxlsb = "0.3"
tempfile = "3"
xlsb-writer = "0.1"

[[bench]]
name = "read_comparison"
harness = false
